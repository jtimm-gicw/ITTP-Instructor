<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transitions & Animations Demo</title>
  <link href="css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <header>
    <h1>CSS Transitions & Animations Demo</h1>
    <nav>
      <ul>
        <li class="nav-link">
          <a href="https://www.google.com/">HEY!</a>
        </li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- 🔹 IMAGE TRANSFORM DEMO -->
    <section>
      <h2>Transforms: Image Hover Effects</h2>

      <!-- Use any image you want here -->
      <img class="card" src="https://placehold.co/200x200/orange/white" alt="Demo Image">

      <!-- Optional second image for comparison -->
      <img class="pulse" src="https://placehold.co/200x200/green/white" alt="Demo Image 2">
    </section>


    <!-- 🔹 TRANSITION DEMOS -->
    <section>
      <h2>Transition: Rounded Box</h2>
      <div class="rounding"></div>
    </section>

    <section>
      <h2>Transition: Button Hover/Active</h2>
      <button class="doNothing">Hover / Click Me!</button>
    </section>


    <!-- 🔹 ANIMATION DEMOS -->
    <section>
      <h2>Animation: Moving Box</h2>
      <div class="animation">
        <div class="animationElement"></div>
      </div>
    </section>

    <section>
      <h2>Animation: Blinking Text</h2>
      <p class="blink">This text will blink!</p>
    </section>


    <!-- 🔹 EXTRA ANIMATION PLAYGROUND -->
    <section>
      <h2>Extra Animation Playground</h2>

      <!-- For pulse animation -->
      <div class="pulse-box"></div>

      <!-- For slide animation -->
      <div class="slide-box"></div>

      <!-- For spin animation -->
      <div class="spin-box"></div>

    </section>

  </main>

</body>
</html>
