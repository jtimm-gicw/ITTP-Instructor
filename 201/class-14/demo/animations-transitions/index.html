<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transitions & Animations Demo</title>
  <link href="css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <header>
    <h1>CSS Transitions & Animations Demo</h1>
  </header>

  <main>
    <section>
      <h2>Transition: Rounded Box</h2>
      <div class="rounding"></div>
    </section>

    <section>
      <h2>Transition: Button Hover/Active</h2>
      <button class="doNothing">Hover / Click Me!</button>
    </section>

    <section>
      <h2>Animation: Moving Box</h2>
      <div class="animation">
        <div class="animationElement"></div>
      </div>
    </section>

    <section>
      <h2>Animation: Blinking Text</h2>
      <p class="blink">This text will blink!</p>
    </section>
  </main>

</body>
</html>
