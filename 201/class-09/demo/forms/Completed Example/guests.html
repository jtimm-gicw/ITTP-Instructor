<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guest List Starter</title>
</head>
<body>

  <h1>Guest List</h1>

  <!-- Basic Click Demo Element -->
  <div id="click-box">
    Click Me
  </div>


  <!-- Form (We will wire this up in class) -->
  <h2>Add Guest</h2>

  <form id="guest-form">

    <label>
      Name:
      <input type="text" id="guest-name">
    </label>

    <br><br>

    <label>
      Age:
      <input type="number" id="guest-age">
    </label>

    <br><br>

    <button type="submit">Add Guest</button>

  </form>


  <!-- Table Structure -->
  <h2>Guests</h2>

  <table id="guest-table" border="1">
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be added here -->
    </tbody>
  </table>

  <script src="app.js"></script>

</body>
</html>
