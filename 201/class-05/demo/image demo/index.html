<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image & CSS Styling Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Image Types & CSS Styling Demo</h1>

  <article>
    <p>
      This demo page shows how different images can be styled using CSS.
      We are using placeholder images so we can focus on layout, borders,
      sizing, and text styling before adding real content.
    </p>
  </article>

  <!-- BASIC IMAGE -->
  <figure>
    <img 
      src="https://via.placeholder.com/400x250"
      alt="Basic placeholder image"
      class="img-basic">
    <figcaption>Basic responsive image (width: 100%)</figcaption>
  </figure>

  <!-- IMAGE WITH BORDER -->
  <figure>
    <img 
      src="https://via.placeholder.com/400x250"
      alt="Placeholder image with border"
      class="img-border">
    <figcaption>Image with a visible border</figcaption>
  </figure>

  <!-- ROUNDED IMAGE -->
  <figure>
    <img 
      src="https://via.placeholder.com/400x250"
      alt="Rounded corner placeholder image"
      class="img-rounded">
    <figcaption>Image with rounded corners</figcaption>
  </figure>

  <!-- IMAGE WITH SHADOW -->
  <figure>
    <img 
      src="https://via.placeholder.com/400x250"
      alt="Placeholder image with shadow"
      class="img-shadow">
    <figcaption>Image with box-shadow for depth</figcaption>
  </figure>

  <!-- DIFFERENT SIZES -->
  <section class="image-row">
    <figure>
      <img 
        src="https://via.placeholder.com/200"
        alt="Small placeholder image"
        class="img-small">
      <figcaption>Small image</figcaption>
    </figure>

    <figure>
      <img 
        src="https://via.placeholder.com/300"
        alt="Medium placeholder image"
        class="img-medium">
      <figcaption>Medium image</figcaption>
    </figure>

    <figure>
      <img 
        src="https://via.placeholder.com/400"
        alt="Large placeholder image"
        class="img-large">
      <figcaption>Large image</figcaption>
    </figure>
  </section>

</body>
</html>
